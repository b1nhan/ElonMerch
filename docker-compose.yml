version: "3.9"

services:
  # Nginx Web Server
  nginx:
    image: nginx:1.25-alpine
    container_name: elonmerch_nginx
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api:/var/www/api:ro
      - ./frontend/dist:/var/www/frontend:ro
    depends_on:
      - php
    networks:
      - elonmerch_network
    restart: unless-stopped

  # PHP-FPM Backend
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: elonmerch_php
    environment:
      # Database Configuration
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-elonmerch_db}
      - DB_PORT=3306
      # PHP Environment
      - PHP_ENV=${PHP_ENV:-development}
      # JWT Configuration (CRITICAL - matches frontend token verification)
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_change_this_in_production}
      # API Configuration
      - API_URL=${API_URL:-http://localhost}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:5173}
    volumes:
      - ./api:/var/www/api
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - elonmerch_network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: elonmerch_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-elonmerch_db}
      MYSQL_USER: ${DB_USER:-elonmerch_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s
    networks:
      - elonmerch_network
    restart: unless-stopped

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: elonmerch_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - elonmerch_network
    restart: unless-stopped

networks:
  elonmerch_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
