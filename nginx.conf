user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Upstream PHP-FPM
    upstream php_backend {
        server php:9000;
    }

    # API BACKEND SERVER
    server {
        listen 80 default_server;
        server_name _; 
        root /var/www/api;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            
            # ============================================================
            # CRITICAL: Include default fastcgi_params first
            # ============================================================
            include fastcgi_params;
            
            # ============================================================
            # CRITICAL: Explicitly pass Authorization header
            # This converts 'Authorization' request header to HTTP_AUTHORIZATION
            # ============================================================
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            
            # ============================================================
            # ADDITIONAL: Pass other important headers
            # ============================================================
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            
            # ============================================================
            # BUFFER SETTINGS: Increase buffer sizes for larger requests
            # ============================================================
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            
            # ============================================================
            # TIMEOUT SETTINGS: Give PHP more time to process
            # ============================================================
            fastcgi_connect_timeout 300s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
